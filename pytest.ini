# Pytest configuration for the whole repository.
#
# This lives at the repository root because that is where pytest is run from:
# every documented invocation is `PYTHONPATH=backend/src pytest tests/backend/...`
# (CLAUDE.md, Makefile, ci.yml). The same sections used to live in
# backend/pyproject.toml, which pytest never loaded from here -- it reported a
# `rootdir:` line and no `configfile:` line at all, so the markers below were
# unregistered and the coverage threshold was inert everywhere except CI, which
# passed --cov-fail-under explicitly. That is why nobody noticed.
#
# It is deliberately NOT a root pyproject.toml: that would create a second
# Python project definition beside backend/pyproject.toml, and CLAUDE.md's
# "Ruff Config: pyproject.toml" line is already ambiguous for want of one.
#
# Coverage settings are in .coveragerc, not here -- [coverage:run] is not a
# section pytest.ini accepts, and coverage only reads its own tables out of a
# pyproject.toml.
[pytest]
markers =
    e2e: E2E tests requiring MiniStack
    slow: slow tests (deselect with -m 'not slow')

# Coverage is on by default so the 80% floor in .coveragerc applies to a bare
# `pytest tests/backend/unit` -- including `npm run test:backend`, which passes
# no flags. The threshold itself is in .coveragerc and nowhere else.
#
# Two consequences, both intended:
#   - running a single file (`pytest tests/backend/unit/test_gemini_handler.py`)
#     reports ~10% and exits 1. Add `--no-cov` for that; the tests themselves
#     still run and report normally.
#   - the E2E suite is invoked with `--no-cov` (Makefile, ci.yml). Eleven tests
#     against MiniStack cannot reach 80% of backend/src and holding them to it
#     would only teach people to ignore the number.
addopts = --cov=backend/src --cov-report=term-missing
