AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pixel Prompt v2 - Focused 4-model image generation with iterative refinement

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Environment Configuration"
        Parameters:
          - Environment
      - Label:
          default: "Gemini Configuration (Google)"
        Parameters:
          - GeminiEnabled
          - GeminiApiKey
          - GeminiModelId
      - Label:
          default: "Nova Canvas Configuration (AWS Bedrock)"
        Parameters:
          - NovaEnabled
          - NovaModelId
      - Label:
          default: "OpenAI (DALL-E 3) Configuration"
        Parameters:
          - OpenaiEnabled
          - OpenaiApiKey
          - OpenaiModelId
      - Label:
          default: "Adobe Firefly Configuration"
        Parameters:
          - FireflyEnabled
          - FireflyClientId
          - FireflyClientSecret
          - FireflyModelId
      - Label:
          default: "Prompt Enhancement"
        Parameters:
          - PromptModelProvider
          - PromptModelId
          - PromptModelApiKey
      - Label:
          default: "Pricing and Credits"
        Parameters:
          - CreditsEnabled
          - PaidPriceUsdCents
          - OverageUsdCentsPerCredit
          - CreditsPerGenerate
          - CreditsPerRefine
          - CreditsPerOutpaint
          - FreeMonthlyCredits
          - PaidMonthlyCredits
          - FreeCreditPeriodSeconds
          - PaidCreditFallbackPeriodSeconds
      - Label:
          default: "Spend Ceilings (global budget)"
        Parameters:
          - MonthlySpendCeilingUsdMicros
          - GlobalDailySpendCeilingUsdMicros
          - EnhanceDailySpendCeilingUsdMicros
      - Label:
          default: "Per-Model Daily Caps"
        Parameters:
          - ModelGeminiDailyCap
          - ModelNovaDailyCap
          - ModelOpenaiDailyCap
          - ModelFireflyDailyCap
      - Label:
          default: "CAPTCHA (Cloudflare Turnstile)"
        Parameters:
          - CaptchaEnabled
          - TurnstileSecretKey
          - AgeGateEnabled
      - Label:
          default: "Email Notifications (SES)"
        Parameters:
          - SesEnabled
          - SesFromEmail
          - SesRegion
      - Label:
          default: "Admin Dashboard"
        Parameters:
          - AdminEnabled
      - Label:
          default: "CORS"
        Parameters:
          - CorsAllowedOrigin
      - Label:
          default: "Tier System (DynamoDB)"
        Parameters:
          - UsersTableName
      - Label:
          default: "Cognito (Auth)"
        Parameters:
          - CognitoDomainPrefix
          - CognitoCallbackUrl
          - CognitoLogoutUrl

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource tagging

  # Gemini Configuration
  GeminiEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Google Gemini model

  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Google Gemini API key

  GeminiModelId:
    Type: String
    Default: "gemini-3.1-flash-image-preview"
    Description: Gemini model ID for image generation

  # Nova Canvas (AWS Bedrock) Configuration
  NovaEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Amazon Nova Canvas via Bedrock

  NovaModelId:
    Type: String
    Default: "amazon.nova-canvas-v1:0"
    Description: Nova Canvas Bedrock model identifier

  # OpenAI (DALL-E 3) Configuration
  OpenaiEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable OpenAI DALL-E 3 model

  OpenaiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: OpenAI API key

  OpenaiModelId:
    Type: String
    Default: "dall-e-3"
    Description: OpenAI image generation model ID

  # Adobe Firefly Configuration
  FireflyEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Adobe Firefly model

  FireflyClientId:
    Type: String
    NoEcho: true
    Default: ""
    Description: Adobe Firefly OAuth2 client ID

  FireflyClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Adobe Firefly OAuth2 client secret

  FireflyModelId:
    Type: String
    Default: "firefly-image-5"
    Description: Adobe Firefly model ID

  # Prompt Enhancement Model
  PromptModelProvider:
    Type: String
    Default: "openai"
    AllowedValues:
      - openai
      - google_gemini
    Description: Provider for prompt enhancement (text/chat model)

  PromptModelId:
    Type: String
    Default: "gpt-4o"
    Description: Model ID for prompt enhancement

  PromptModelApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: API key for prompt enhancement model

  # CORS
  CorsAllowedOrigin:
    Type: String
    Default: "http://localhost:5173"
    Description: Allowed CORS origin -- must be an exact URL (not *) because credentials (cookies) are required. Set to your frontend domain in production.

  # Tier System
  UsersTableName:
    Type: String
    Default: "pixel-prompt-users"
    Description: DynamoDB table name for tier and quota state

  # Cognito
  CognitoDomainPrefix:
    Type: String
    Default: ""
    Description: Cognito Hosted UI domain prefix (must be globally unique within region)

  CognitoCallbackUrl:
    Type: String
    Default: "http://localhost:5173/auth/callback"
    Description: OAuth2 callback URL for Cognito Hosted UI

  CognitoLogoutUrl:
    Type: String
    Default: "http://localhost:5173/"
    Description: OAuth2 logout redirect URL for Cognito Hosted UI

  # Feature Flags
  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Email address for operational alarms (spend, provider errors, quota
      rejections). Leave empty to create the topic without a subscription --
      alarms still fire and are visible in CloudWatch, but nothing is
      delivered. Set it if you want to be told before the invoice arrives.

  MonthlySpendWarningUsd:
    Type: Number
    Default: 350
    Description: >-
      Monthly spend in dollars that triggers a warning. Default 350 is 70% of
      the default ceiling, which leaves time to decide rather than only
      telling you after service has already stopped.

  DailySpendWarningUsd:
    Type: Number
    Default: 15
    Description: >-
      Daily spend in dollars that triggers a warning. Default 15 is 60% of the
      default daily ceiling.

  FreeTierSpendWarningUsd:
    Type: Number
    Default: 5
    Description: Daily free-tier spend in dollars that triggers a warning

  QuotaRejectionThreshold:
    Type: Number
    Default: 50
    Description: Quota rejections per 15 minutes that trigger an alarm

  AuthEnabled:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      REQUIRED, no default. Enable Cognito auth and tier resolution. Gates
      identity only -- quota, cost caps and spend metering apply either way.
      There is no safe default to assume: "false" serves unauthenticated
      traffic, "true" requires Cognito and GUEST_TOKEN_SECRET. Deliberately
      left unset so the choice is made in the deploy parameters rather than
      inherited silently.

  BillingEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Stripe billing (requires AuthEnabled=true)

  GuestTokenSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: HMAC secret for signing guest cookies (required when AuthEnabled=true)

  # Tier Limits
  GuestGenerateLimit:
    Type: Number
    Default: 1
    Description: Generations per guest per window

  GuestWindowSeconds:
    Type: Number
    Default: 3600
    Description: Guest rolling window length in seconds

  AnonGenerateLimit:
    Type: Number
    Default: 5
    Description: >-
      /generate calls per source IP per window when AUTH_ENABLED=false.
      AUTH_ENABLED gates identity only; an open deployment is still metered.

  AnonRefineLimit:
    Type: Number
    Default: 10
    Description: /iterate + /outpaint calls per source IP when AUTH_ENABLED=false

  AnonWindowSeconds:
    Type: Number
    Default: 3600
    Description: Rolling window for anonymous limits, in seconds

  GuestIpGenerateLimit:
    Type: Number
    Default: 3
    Description: >-
      Guest generations per source-IP hash per window. Must be BELOW
      GuestGlobalLimit or it can never bind first. Stops one caller cycling
      cookies from draining the shared guest pool.

  GuestIpWindowSeconds:
    Type: Number
    Default: 3600
    Description: Rolling window for the per-IP guest limit, in seconds

  GuestGlobalLimit:
    Type: Number
    Default: 5
    Description: Global guest generation cap per window

  GuestGlobalWindowSeconds:
    Type: Number
    Default: 3600
    Description: Global guest window length in seconds

  FreeGenerateLimit:
    Type: Number
    Default: 1
    Description: Generations per free user per window

  FreeRefineLimit:
    Type: Number
    Default: 2
    Description: Refinements per free user per window

  FreeWindowSeconds:
    Type: Number
    Default: 3600
    Description: Free tier rolling window length in seconds

  PaidDailyLimit:
    Type: Number
    Default: 200
    Description: Refinements per paid user per day

  PaidWindowSeconds:
    Type: Number
    Default: 86400
    Description: Paid tier rolling window length in seconds

  # Stripe
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Stripe API secret key (required when BillingEnabled=true)

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Stripe webhook signing secret (required when BillingEnabled=true)

  StripePriceId:
    Type: String
    Default: ""
    Description: Stripe Price ID for the paid subscription

  StripeSuccessUrl:
    Type: String
    Default: "http://localhost:5173/billing/success"
    Description: Redirect URL after successful Stripe checkout

  StripeCancelUrl:
    Type: String
    Default: "http://localhost:5173/billing/cancel"
    Description: Redirect URL after cancelled Stripe checkout

  StripePortalReturnUrl:
    Type: String
    Default: "http://localhost:5173/"
    Description: Return URL from Stripe Customer Portal

  # Per-Model Daily Caps
  CreditsEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable the credit ledger (P0-C). When false, the legacy call-counting
      quotas apply, so this can be rolled back without redeploying old code.

  PaidPriceUsdCents:
    Type: Number
    Default: 1900
    Description: >-
      Display price for the paid tier in whole cents (1900 = $19/mo). Served
      to the UI via GET /pricing so a price experiment is a stack update
      rather than a frontend rebuild. Must match the Stripe price.

  OverageUsdCentsPerCredit:
    Type: Number
    Default: 50
    Description: Price per credit beyond the allotment, in cents

  CreditsPerGenerate:
    Type: Number
    Default: 100
    Description: Centi-credits charged per /generate (100 = 1.00 credit)

  CreditsPerRefine:
    Type: Number
    Default: 25
    Description: Centi-credits charged per /iterate (25 = 0.25 credit)

  CreditsPerOutpaint:
    Type: Number
    Default: 25
    Description: Centi-credits charged per /outpaint (25 = 0.25 credit)

  FreeMonthlyCredits:
    Type: Number
    Default: 500
    Description: >-
      Centi-credits granted per period to free users (500 = 5 credits). This
      is the free tier's spend bound; it replaces a rate limit that bounded
      request rate but not monthly cost.

  PaidMonthlyCredits:
    Type: Number
    Default: 6500
    Description: Centi-credits granted per Stripe billing period to paid users (6500 = 65)

  FreeCreditPeriodSeconds:
    Type: Number
    Default: 2592000
    Description: >-
      Renewal window for free accounts in seconds (2592000 = 30 days). Free
      accounts have no Stripe period, so they use a fixed cycle.

  PaidCreditFallbackPeriodSeconds:
    Type: Number
    Default: 2592000
    Description: >-
      Fallback renewal window for a paid user whose Stripe billing period is
      unknown (webhook missed, or an older API shape). Used only as a floor so
      a paying customer is never left at zero credits.

  MonthlySpendCeilingUsdMicros:
    Type: Number
    Default: 500000000
    Description: >-
      Hard monthly spend ceiling in micro-dollars. Default 500000000 = $500
      per calendar month. This is the bound that caps the invoice: a daily
      ceiling alone does not, since even $25/day permits about $750 over 30
      days. Set to 0 to disable, consciously.

  GlobalDailySpendCeilingUsdMicros:
    Type: Number
    Default: 25000000
    Description: >-
      Hard daily spend ceiling in micro-dollars (1e-6 USD). Default 25000000
      = $25/day. Deliberately 1/20th of the monthly ceiling rather than
      1/30th, so a busy day is not throttled for being busy while a single
      day still cannot consume the month. Applies in every configuration,
      including AUTH_ENABLED=false. Set to 0 to disable (not recommended).

  EnhanceDailySpendCeilingUsdMicros:
    Type: Number
    Default: 2000000
    Description: >-
      Sub-ceiling for /enhance in micro-dollars. Default 2000000 = $2/day,
      about 12% of the monthly budget. At $5/day this unauthenticated
      endpoint could have claimed 30% of the total.
      /enhance is unauthenticated, so without its own bound anonymous traffic
      could exhaust the global budget and 503 paying users. Set 0 to disable.

  ModelGeminiDailyCap:
    Type: Number
    Default: 500
    Description: Daily generation cap for Gemini model

  ModelNovaDailyCap:
    Type: Number
    Default: 500
    Description: Daily generation cap for Nova Canvas model

  ModelOpenaiDailyCap:
    Type: Number
    Default: 500
    Description: Daily generation cap for OpenAI model

  ModelFireflyDailyCap:
    Type: Number
    Default: 500
    Description: Daily generation cap for Firefly model

  GenerateAsync:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Dispatch /generate provider work via an asynchronous self-invocation and
      answer the caller with 202. Set false only where there is no Lambda
      service to invoke (sam local, the MiniStack E2E suite): the inline path
      runs a 70s dispatch budget behind the 30s gateway ceiling below.

  # CAPTCHA
  CaptchaEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Cloudflare Turnstile CAPTCHA for guest /generate

  AgeGateEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    # Defaults to true, unlike every other feature flag here. Google's API
    # terms permit use only where the calling service is not "likely to be
    # accessed by" individuals under 18, so the compliant posture is what an
    # operator gets by changing nothing. Turning it off is the explicit act.
    Description: >-
      Require an 18+ confirmation before a first /generate. Leave enabled
      unless you have another way to meet the provider age requirements.

  TurnstileSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Cloudflare Turnstile secret key (required when CaptchaEnabled=true)

  # SES Email Notifications
  SesEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Amazon SES email notifications

  SesFromEmail:
    Type: String
    Default: ""
    Description: Verified SES sender email address (required when SesEnabled=true)

  SesRegion:
    Type: String
    Default: "us-west-2"
    Description: AWS region for SES

  # Admin
  AdminEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable admin dashboard and API (requires AuthEnabled=true)


Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  AuthEnabledCondition: !Equals [!Ref AuthEnabled, "true"]


Globals:
  Function:
    Tags:
      Project: PixelPromptV2
      Environment: !Ref Environment
      ManagedBy: SAM

Resources:
  PixelPromptFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-function'
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      CodeUri: ./src
      MemorySize: 3008
      Timeout: 900
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          # Model Configuration
          GEMINI_ENABLED: !Ref GeminiEnabled
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL_ID: !Ref GeminiModelId
          NOVA_ENABLED: !Ref NovaEnabled
          NOVA_MODEL_ID: !Ref NovaModelId
          OPENAI_ENABLED: !Ref OpenaiEnabled
          OPENAI_API_KEY: !Ref OpenaiApiKey
          OPENAI_MODEL_ID: !Ref OpenaiModelId
          FIREFLY_ENABLED: !Ref FireflyEnabled
          FIREFLY_CLIENT_ID: !Ref FireflyClientId
          FIREFLY_CLIENT_SECRET: !Ref FireflyClientSecret
          FIREFLY_MODEL_ID: !Ref FireflyModelId
          # Prompt Enhancement
          PROMPT_MODEL_PROVIDER: !Ref PromptModelProvider
          PROMPT_MODEL_ID: !Ref PromptModelId
          PROMPT_MODEL_API_KEY: !Ref PromptModelApiKey
          # CORS
          CORS_ALLOWED_ORIGIN: !Ref CorsAllowedOrigin
          # S3 and CloudFront
          S3_BUCKET: !Ref PixelPromptBucket
          CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
          # Tier system
          AUTH_ENABLED: !Ref AuthEnabled
          BILLING_ENABLED: !Ref BillingEnabled
          GUEST_TOKEN_SECRET: !Ref GuestTokenSecret
          USERS_TABLE_NAME: !Ref UsersTable
          COGNITO_USER_POOL_ID: !If [AuthEnabledCondition, !Ref UserPool, ""]
          COGNITO_USER_POOL_CLIENT_ID: !If [AuthEnabledCondition, !Ref UserPoolClient, ""]
          COGNITO_DOMAIN: !If [AuthEnabledCondition, !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com", ""]
          COGNITO_REGION: !Ref AWS::Region
          # Guest limits
          GUEST_GENERATE_LIMIT: !Ref GuestGenerateLimit
          GUEST_WINDOW_SECONDS: !Ref GuestWindowSeconds
          ANON_GENERATE_LIMIT: !Ref AnonGenerateLimit
          ANON_REFINE_LIMIT: !Ref AnonRefineLimit
          ANON_WINDOW_SECONDS: !Ref AnonWindowSeconds
          GUEST_IP_GENERATE_LIMIT: !Ref GuestIpGenerateLimit
          GUEST_IP_WINDOW_SECONDS: !Ref GuestIpWindowSeconds
          GUEST_GLOBAL_LIMIT: !Ref GuestGlobalLimit
          GUEST_GLOBAL_WINDOW_SECONDS: !Ref GuestGlobalWindowSeconds
          # Free tier limits
          FREE_GENERATE_LIMIT: !Ref FreeGenerateLimit
          FREE_REFINE_LIMIT: !Ref FreeRefineLimit
          FREE_WINDOW_SECONDS: !Ref FreeWindowSeconds
          # Paid tier limits
          PAID_DAILY_LIMIT: !Ref PaidDailyLimit
          PAID_WINDOW_SECONDS: !Ref PaidWindowSeconds
          # Stripe
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          STRIPE_PRICE_ID: !Ref StripePriceId
          STRIPE_SUCCESS_URL: !Ref StripeSuccessUrl
          STRIPE_CANCEL_URL: !Ref StripeCancelUrl
          STRIPE_PORTAL_RETURN_URL: !Ref StripePortalReturnUrl
          # Per-model daily caps
          CREDITS_ENABLED: !Ref CreditsEnabled
          PAID_PRICE_USD_CENTS: !Ref PaidPriceUsdCents
          OVERAGE_USD_CENTS_PER_CREDIT: !Ref OverageUsdCentsPerCredit
          CREDITS_PER_GENERATE: !Ref CreditsPerGenerate
          CREDITS_PER_REFINE: !Ref CreditsPerRefine
          CREDITS_PER_OUTPAINT: !Ref CreditsPerOutpaint
          FREE_MONTHLY_CREDITS: !Ref FreeMonthlyCredits
          PAID_MONTHLY_CREDITS: !Ref PaidMonthlyCredits
          FREE_CREDIT_PERIOD_SECONDS: !Ref FreeCreditPeriodSeconds
          PAID_CREDIT_FALLBACK_PERIOD_SECONDS: !Ref PaidCreditFallbackPeriodSeconds
          MONTHLY_SPEND_CEILING_USD_MICROS: !Ref MonthlySpendCeilingUsdMicros
          GLOBAL_DAILY_SPEND_CEILING_USD_MICROS: !Ref GlobalDailySpendCeilingUsdMicros
          ENHANCE_DAILY_SPEND_CEILING_USD_MICROS: !Ref EnhanceDailySpendCeilingUsdMicros
          MODEL_GEMINI_DAILY_CAP: !Ref ModelGeminiDailyCap
          MODEL_NOVA_DAILY_CAP: !Ref ModelNovaDailyCap
          MODEL_OPENAI_DAILY_CAP: !Ref ModelOpenaiDailyCap
          MODEL_FIREFLY_DAILY_CAP: !Ref ModelFireflyDailyCap
          # CAPTCHA
          CAPTCHA_ENABLED: !Ref CaptchaEnabled
          AGE_GATE_ENABLED: !Ref AgeGateEnabled
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          # SES
          SES_ENABLED: !Ref SesEnabled
          SES_FROM_EMAIL: !Ref SesFromEmail
          SES_REGION: !Ref SesRegion
          # Admin
          ADMIN_ENABLED: !Ref AdminEnabled
          # Async generate dispatch
          GENERATE_ASYNC: !Ref GenerateAsync
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Version: '2012-10-17'
          Statement:
            - Sid: S3ReadWriteImages
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub '${PixelPromptBucket.Arn}/sessions/*'
                - !Sub '${PixelPromptBucket.Arn}/private/*'
            - Sid: S3ListBucket
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt PixelPromptBucket.Arn
              Condition:
                StringLike:
                  s3:prefix:
                    - 'sessions/*'
            - Sid: BedrockInvokeModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
            - Sid: CloudWatchPutMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
            - Sid: SesSendEmail
              Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
            # The literal !Sub form is required. A !GetAtt on this
            # function's own Arn would be a circular dependency -- the policy
            # is attached to that same function -- and the stack would not
            # deploy. The literal form works because FunctionName above is
            # itself !Sub '${AWS::StackName}-function'; if that ever changes,
            # this must change with it.
            - Sid: SelfInvokeForGeneration
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-function"
      Events:
        # The integration timeout is stated explicitly on the three routes
        # that can do provider work. 30000ms is an AWS hard cap on HTTP API
        # integrations and is not adjustable via a quota increase; declaring
        # 29000 puts the real bound where a reader looks for it instead of
        # leaving it an invisible service default. Keep it equal to
        # config.gateway_integration_timeout_seconds * 1000 --
        # tests/backend/unit/test_dispatch_budget.py fails if the two drift.
        GenerateApi:
          Type: HttpApi
          Properties:
            Path: /generate
            Method: POST
            ApiId: !Ref HttpApi
            TimeoutInMillis: 29000
        IterateApi:
          Type: HttpApi
          Properties:
            Path: /iterate
            Method: POST
            ApiId: !Ref HttpApi
            TimeoutInMillis: 29000
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        OutpaintApi:
          Type: HttpApi
          Properties:
            Path: /outpaint
            Method: POST
            ApiId: !Ref HttpApi
            TimeoutInMillis: 29000
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        GetMe:
          Type: HttpApi
          Properties:
            Path: /me
            Method: GET
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        PostBillingCheckout:
          Type: HttpApi
          Properties:
            Path: /billing/checkout
            Method: POST
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        PostBillingPortal:
          Type: HttpApi
          Properties:
            Path: /billing/portal
            Method: POST
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        PostStripeWebhook:
          Type: HttpApi
          Properties:
            Path: /stripe/webhook
            Method: POST
            ApiId: !Ref HttpApi
        StatusApi:
          Type: HttpApi
          Properties:
            Path: /status/{sessionId}
            Method: GET
            ApiId: !Ref HttpApi
        EnhanceApi:
          Type: HttpApi
          Properties:
            Path: /enhance
            Method: POST
            ApiId: !Ref HttpApi
        LogApi:
          Type: HttpApi
          Properties:
            Path: /log
            Method: POST
            ApiId: !Ref HttpApi
        PricingApi:
          Type: HttpApi
          Properties:
            Path: /pricing
            Method: GET
            ApiId: !Ref HttpApi
        GalleryListApi:
          Type: HttpApi
          Properties:
            Path: /gallery/list
            Method: GET
            ApiId: !Ref HttpApi
        GalleryDetailApi:
          Type: HttpApi
          Properties:
            Path: /gallery/{sessionId}
            Method: GET
            ApiId: !Ref HttpApi
        PromptRecentApi:
          Type: HttpApi
          Properties:
            Path: /prompts/recent
            Method: GET
            ApiId: !Ref HttpApi
        PromptHistoryApi:
          Type: HttpApi
          Properties:
            Path: /prompts/history
            Method: GET
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        DownloadApi:
          Type: HttpApi
          Properties:
            Path: /download/{sessionId}/{model}/{iterationIndex}
            Method: GET
            ApiId: !Ref HttpApi
        # Admin API routes (JWT auth gated)
        AdminUsersListApi:
          Type: HttpApi
          Properties:
            Path: /admin/users
            Method: GET
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminUserDetailApi:
          Type: HttpApi
          Properties:
            Path: /admin/users/{userId}
            Method: GET
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminUserSuspendApi:
          Type: HttpApi
          Properties:
            Path: /admin/users/{userId}/suspend
            Method: POST
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminUserUnsuspendApi:
          Type: HttpApi
          Properties:
            Path: /admin/users/{userId}/unsuspend
            Method: POST
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminUserNotifyApi:
          Type: HttpApi
          Properties:
            Path: /admin/users/{userId}/notify
            Method: POST
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminModelsListApi:
          Type: HttpApi
          Properties:
            Path: /admin/models
            Method: GET
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminModelDisableApi:
          Type: HttpApi
          Properties:
            Path: /admin/models/{model}/disable
            Method: POST
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminModelEnableApi:
          Type: HttpApi
          Properties:
            Path: /admin/models/{model}/enable
            Method: POST
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminMetricsApi:
          Type: HttpApi
          Properties:
            Path: /admin/metrics
            Method: GET
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        AdminRevenueApi:
          Type: HttpApi
          Properties:
            Path: /admin/revenue
            Method: GET
            ApiId: !Ref HttpApi
            Auth: !If
              - AuthEnabledCondition
              - Authorizer: CognitoJwt
              - {}
        DailySnapshotSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)
            Description: Daily operational metrics snapshot
            Enabled: true
            Input: '{"source": "scheduled", "action": "daily_snapshot"}'

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowedOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
          - X-Correlation-ID
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        # The gateway overrides the integration's CORS headers, so the
        # Access-Control-Expose-Headers the Lambda sets does not survive on its
        # own. Retry-After is not CORS-safelisted: without this a browser reads
        # null for it and the backoff hint is unreadable cross-origin.
        ExposeHeaders:
          - Retry-After
          - X-Correlation-ID
        MaxAge: 86400
        AllowCredentials: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Auth: !If
        - AuthEnabledCondition
        - Authorizers:
            CognitoJwt:
              JwtConfiguration:
                issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
                audience:
                  - !Ref UserPoolClient
              IdentitySource: "$request.header.Authorization"
        - {}

  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: AuthEnabledCondition
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: AuthEnabledCondition
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-web"
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs: [!Ref CognitoCallbackUrl]
      LogoutURLs: [!Ref CognitoLogoutUrl]
      SupportedIdentityProviders: [COGNITO]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: AuthEnabledCondition
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: AuthEnabledCondition
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: Administrators with access to /admin endpoints

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref UsersTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: promptOwner
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
        - AttributeName: stripeCustomerId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PromptHistoryIndex
          KeySchema:
            - AttributeName: promptOwner
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Reverse lookup: Stripe customer -> userId. Required because real
        # customer.subscription.* payloads carry neither client_reference_id
        # nor metadata.userId for subscriptions created before
        # subscription_data.metadata was set at checkout.
        - IndexName: StripeCustomerIndex
          KeySchema:
            - AttributeName: stripeCustomerId
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PixelPromptBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'pixel-prompt-v2-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldSessions
            Status: Enabled
            ExpirationInDays: 30
            Prefix: sessions/
          # Paid-tier images live outside sessions/, so the rule above does not
          # reach them. Without this they would be retained forever, breaking
          # the 30-day deletion the privacy policy states and growing storage
          # cost without bound.
          - Id: DeleteOldPrivateSessions
            Status: Enabled
            ExpirationInDays: 30
            Prefix: private/
    DeletionPolicy: Retain

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${AWS::StackName}'

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PixelPromptBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAI
            Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            # Scoped to the public gallery prefix only. Objects under
            # private/* are deliberately outside this grant, so they have no
            # unsigned CloudFront URL at all and can only be reached through a
            # presigned URL the Lambda issues after checking ownership. This is
            # what makes paid-tier privacy a property of the infrastructure
            # rather than of remembering to filter every read path.
            Resource: !Sub '${PixelPromptBucket.Arn}/sessions/*'
          # Session state also lives under sessions/, at sessions/{uuid}/, and
          # holds the prompt and the owner id. It is read by the Lambda over
          # S3 and never needs to be on the CDN. An explicit Deny keeps it off
          # without narrowing the grant to *.png, which would break the legacy
          # JSON-format gallery images still served through CloudFront.
          - Sid: DenyCdnAccessToSessionState
            Effect: Deny
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource:
              - !Sub '${PixelPromptBucket.Arn}/sessions/*/status.json'
              - !Sub '${PixelPromptBucket.Arn}/sessions/*/context/*'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'CloudFront for ${AWS::StackName}'
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt PixelPromptBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
          DefaultTTL: 86400
          MaxTTL: 31536000
        PriceClass: PriceClass_100

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PixelPromptFunction}'
      # 30 days, not 7. Investigating a spend anomaly against a monthly
      # budget means looking back across the month that produced it, and a
      # 7-day window cannot cover a bill you notice at month end.
      RetentionInDays: 30

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'
      DisplayName: Pixel Prompt operational alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-lambda-errors'
      AlarmDescription: Alert on Lambda function errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref PixelPromptFunction
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Spend is recorded in DynamoDB and shown on the admin dashboard, but
  # neither can page anyone. These are what make a runaway bill something an
  # operator hears about before the invoice.
  DailySpendWarningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-daily-spend-warning'
      AlarmDescription: >-
        Daily provider spend has passed the warning threshold. Fires well
        before the hard ceiling so there is time to look rather than just be
        cut off.
      MetricName: TotalSpendUsd
      Namespace: PixelPrompt/Operations
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref DailySpendWarningUsd
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  MonthlySpendWarningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-monthly-spend-warning'
      AlarmDescription: >-
        Monthly provider spend has passed the warning threshold. This is the
        bound that caps the invoice, so it fires well before the hard ceiling
        stops service.
      MetricName: TotalSpendUsd
      Namespace: PixelPrompt/Operations
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 30
      DatapointsToAlarm: 1
      Threshold: !Ref MonthlySpendWarningUsd
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  FreeTierSpendAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-free-tier-spend'
      AlarmDescription: >-
        Free-tier spend is pure acquisition cost and the largest single
        exposure at 4-model access, so it is alarmed separately from total.
      MetricName: SpendUsd
      Namespace: PixelPrompt/Operations
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref FreeTierSpendWarningUsd
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: Tier
          Value: free
      AlarmActions:
        - !Ref AlarmTopic

  QuotaRejectionSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-quota-rejection-spike'
      AlarmDescription: >-
        Sustained quota rejections. Ambiguous by design: it means either
        abuse, or a limit set too low and silently costing signups. Both are
        worth knowing about.
      MetricName: TotalQuotaRejections
      Namespace: PixelPrompt/Operations
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: !Ref QuotaRejectionThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ProviderErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-provider-errors'
      AlarmDescription: >-
        Provider errors across all models. A single provider degrading is
        otherwise invisible until users report missing images.
      # TotalErrorCount, not ErrorCount: the latter is only ever published
      # with an Endpoint dimension, so a dimensionless alarm on it matches no
      # series and can never fire.
      MetricName: TotalErrorCount
      Namespace: PixelPrompt/Operations
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  FunctionName:
    Description: Lambda Function Name
    Value: !Ref PixelPromptFunction

  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'

  CloudFrontDomain:
    Description: CloudFront distribution domain
    Value: !GetAtt CloudFrontDistribution.DomainName

  S3BucketName:
    Description: S3 bucket name
    Value: !Ref PixelPromptBucket

  UsersTableName:
    Description: DynamoDB users table name
    Value: !Ref UsersTable

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  UserPoolDomain:
    Description: Cognito User Pool Hosted UI domain prefix
    Value: !Ref CognitoDomainPrefix
