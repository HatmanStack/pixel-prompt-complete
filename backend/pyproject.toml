[project]
name = "pixel-prompt-backend"
version = "2.0.0"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "ruff==0.15.21",
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "moto==5.2.2",
    "requests-mock==1.12.1",
    "responses==0.26.2",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true

# Strict typing for new code (Phase 1 hardening)
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "boto3.*",
    "botocore.*",
    "openai.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# TYPE RATCHET
#
# Every module below has pre-existing errors from before mypy was wired into
# CI. Modules come OFF this list; nothing goes ON it. Adding a module here to
# make a build pass is the thing this list exists to prevent -- fix the file,
# or narrow its entry to the codes it still needs.
#
# Baseline when this list was written, 2026-07-27:
#     121 errors across 12 of 54 source files.
# Before this phase's fixes it was 136 across 22. The direction is the point.
#
# No entry uses a blanket `ignore_errors`. Each one names the error codes that
# module actually reports today, so a NEW class of error in a listed file still
# fails the build. A blanket ignore catches nothing, which makes it
# indistinguishable from dropping the file from the run -- and it would have
# hidden the live Gemini `call-arg` defect fixed in be82b6d.
#
# The config is discovered from the current directory, so CI passes
# `--config-file backend/pyproject.toml` explicitly. There is no pyproject.toml
# at the repository root; `mypy backend/src/` from there would silently run
# with mypy's defaults and none of the settings above.
# ---------------------------------------------------------------------------

# 49 errors. The bulk is union-attr, from _parse_and_validate_request returning
# (ValidatedRequest | None, ApiResponse | None) and callers reading through the
# first element. A discriminated union clears ~25 of them; Phase 0 records why
# that restructuring belongs with the module split rather than with this gate.
[[tool.mypy.overrides]]
module = ["lambda_function"]
disable_error_code = [
    "arg-type",
    "index",
    "misc",
    "no-untyped-def",
    "union-attr",
]

# 15 errors, spread across six codes: the LLM response shapes are read
# positionally out of untyped SDK objects.
[[tool.mypy.overrides]]
module = ["api.enhance"]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "index",
    "no-untyped-def",
    "union-attr",
]

# Missing annotations only. jobs.manager 1, utils.retry 4 (a decorator, which
# needs ParamSpec to type honestly).
[[tool.mypy.overrides]]
module = ["jobs.manager", "utils.retry"]
disable_error_code = ["no-untyped-def"]

# utils.error_responses 24 (23 of them the factory functions Phase 1 left
# unannotated), utils.logger 6.
[[tool.mypy.overrides]]
module = ["utils.error_responses", "utils.logger"]
disable_error_code = ["assignment", "no-untyped-def"]

# Values read back out of boto3 responses. billing.webhook 3, utils.storage 7.
[[tool.mypy.overrides]]
module = ["billing.webhook", "utils.storage"]
disable_error_code = ["no-any-return", "no-untyped-def"]

# list invariance against the SDKs' unions of accepted content types.
# gemini 2, openai_provider 3.
[[tool.mypy.overrides]]
module = ["models.providers.gemini", "models.providers.openai_provider"]
disable_error_code = ["arg-type"]

# 6 errors: the same list invariance, plus values read out of requests' JSON.
[[tool.mypy.overrides]]
module = ["models.providers.firefly"]
disable_error_code = ["arg-type", "no-any-return"]

# 2 errors, both Pillow: an ImageFile/Image assignment and an iteration over a
# getbbox() that is Optional. Worth a real look rather than an annotation --
# the misc one is "None object is not iterable".
[[tool.mypy.overrides]]
module = ["utils.outpaint"]
disable_error_code = ["assignment", "misc"]

[tool.pytest.ini_options]
markers = [
    "e2e: E2E tests requiring MiniStack",
    "slow: slow tests (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["."]
omit = ["**/tests/**"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long - handled by formatter
