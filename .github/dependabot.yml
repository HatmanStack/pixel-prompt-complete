version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # NOTE: there is intentionally NO `pip` job for /backend. That directory
  # contains a *derived* lockfile, backend/requirements-lock.txt, generated
  # from backend/src/requirements.txt via `make relock`. Dependabot treated the
  # lockfile as a manifest and opened bumps that can never merge -- e.g. bumping
  # pydantic-core, which pydantic pins to an exact version, so `uv pip compile`
  # reverts it every time. The Lambda runtime source is covered by /backend/src
  # below; the derived lock is regenerated, never bumped directly.

  # The Lambda runtime dependencies. /backend/src (below) edits the source and
  # /tests/backend finds the test pins; neither covers this file, which is why
  # Pillow sat at 12.2.0 with 20 advisories here while
  # tests/backend/requirements.txt already asked for >=12.3.0.
  #
  # NOTE: this job can only edit backend/src/requirements.txt, but CI and
  # `make lock-check` install from backend/requirements-lock.txt, which
  # Dependabot does not know about. So a bump here lands with a stale lockfile
  # and fails the backend job until someone runs `make relock` on the PR
  # branch and pushes the result. That extra step is deliberate -- pointing CI
  # at requirements.txt instead would give up reproducible installs to save a
  # command -- but it is not discoverable, hence this comment and the
  # `make relock` hint in lock-check's failure message.
  - package-ecosystem: pip
    directory: /backend/src
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /tests/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
