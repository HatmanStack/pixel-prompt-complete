name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              # tests/** rather than tests/backend/**, and ruff.toml, because
              # the backend job now lints both. A filter narrower than the
              # thing it gates is a job that silently does not run.
              - 'tests/**'
              - 'ruff.toml'

  frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --coverage

  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    env:
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: test-bucket
      PYTHONPATH: ${{ github.workspace }}/backend/src
      # No default in config.py -- there is no safe value to guess, so it must
      # be chosen explicitly. CI runs the unauthenticated path.
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install dependencies
        run: |
          uv pip install --system -r backend/src/requirements.txt
          uv pip install --system -e "backend/.[dev]"
      - name: Lint
        run: ruff check backend/src/ tests/ backend/scripts/
      # Format is checked on backend/src/ only, deliberately. Reformatting the
      # 65 files under tests/ produces a diff no reviewer will read, and
      # formatting drift there has caused no observed problem. See ADR-A6 --
      # this asymmetry is a decision, not an oversight, so please do not
      # "fix" it by adding tests/ here.
      - name: Format check
        run: ruff format --check backend/src/
      # --config-file is not optional. mypy discovers config from the current
      # directory and there is no pyproject.toml at the repository root, so
      # `mypy backend/src/` alone runs with mypy's defaults -- none of the
      # strict settings, none of the type-ratchet overrides. Verified: it
      # reports 80 errors in 17 files that way, against 0 with the config.
      - name: Type check
        run: mypy --config-file backend/pyproject.toml backend/src/
      - name: Tests
        run: pytest tests/backend/unit -v --tb=short --cov=backend/src --cov-report=term-missing --cov-fail-under=80

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true'
    env:
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: test-bucket
      PYTHONPATH: ${{ github.workspace }}/backend/src
      # No default in config.py -- there is no safe value to guess, so it must
      # be chosen explicitly. CI runs the unauthenticated path.
      AUTH_ENABLED: "false"
      MINISTACK_ENDPOINT: http://localhost:4566
    services:
      ministack:
        image: nahuelnucera/ministack
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DEFAULT_REGION: us-east-1
        # No --health-cmd: ministack image has no curl/wget (uvicorn entrypoint only).
        # Health is polled from the runner host below instead.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install dependencies
        run: |
          uv pip install --system -r backend/src/requirements.txt
          uv pip install --system -e "backend/.[dev]"
      - name: Wait for ministack
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:4566/_ministack/health >/dev/null; then
              echo "ministack ready"
              exit 0
            fi
            sleep 2
          done
          echo "ministack failed to become healthy" >&2
          exit 1
      - name: Run E2E tests
        run: pytest tests/backend/e2e -v -m e2e

  docs:
    name: Documentation Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Markdownlint
        run: npx -y markdownlint-cli2 "**/*.md" "#node_modules" "#.claude" "#frontend/node_modules" "#docs/plans" "#.venv"

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend, backend, e2e, docs]
    if: always()
    steps:
      - name: Verify
        run: |
          results=(
            "${{ needs.frontend.result }}"
            "${{ needs.backend.result }}"
            "${{ needs.e2e.result }}"
            "${{ needs.docs.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more checks failed: $result"
              exit 1
            fi
          done
          echo "All checks passed!"
