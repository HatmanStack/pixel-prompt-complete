name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.claude/**'

# Least privilege for the whole workflow. Without this block the job token
# takes the repository default, which on many repos is read/write -- far more
# than any job here needs. Every job only reads the checkout; none comments,
# pushes or publishes, so a narrower grant costs nothing and bounds the blast
# radius of a compromised action.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              # This file decides what the frontend job DOES, so a change to it
              # has to run that job. Otherwise a PR that edits the gate skips
              # the gate -- the same argument the backend filter makes below
              # about pytest.ini and the Makefile, applied to the workflow
              # itself, which is the one file that governs all of them.
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              # tests/** rather than tests/backend/**, and ruff.toml, because
              # the backend job now lints both. A filter narrower than the
              # thing it gates is a job that silently does not run.
              - 'tests/**'
              - 'ruff.toml'
              # The backend job's behaviour also lives outside backend/ now:
              # pytest.ini and .coveragerc carry the markers and the 80% floor,
              # and the job shells out to `make lock-check`. Editing any of
              # them without this would change what the gate does while
              # skipping the gate.
              - 'pytest.ini'
              - '.coveragerc'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --coverage
      # Last, deliberately: a build failure is less informative than a test
      # failure, so the faster signal comes first. Until now no job anywhere
      # produced a production bundle, so the Vite/Rollup-specific paths -- the
      # manualChunks heuristic, PostCSS/Tailwind resolution, the
      # import.meta.env.PROD branches in api/config.ts -- first ran at deploy
      # time. `make build` runs the same command.
      - run: npm run build

  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    env:
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: test-bucket
      PYTHONPATH: ${{ github.workspace }}/backend/src
      # No default in config.py -- there is no safe value to guess, so it must
      # be chosen explicitly. CI runs the unauthenticated path.
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # From the lockfile, not requirements.txt: requirements.txt pins only the
      # eight direct dependencies, so every transitive version was whatever the
      # index served that morning. The dev extras stay unlocked because
      # backend/pyproject.toml already pins each of them exactly.
      - name: Install dependencies
        run: |
          uv pip install --system -r backend/requirements-lock.txt
          uv pip install --system -e "backend/.[dev]"
      # The target, not a copy of its lines -- see the Makefile for why it
      # compiles into the committed path and compares pin lines only. A check
      # written twice is a check that disagrees with itself.
      - name: Check the lockfile is current
        run: make lock-check
      - name: Lint
        run: ruff check backend/src/ tests/ backend/scripts/
      # Format is checked on backend/src/ only, deliberately. Reformatting the
      # 65 files under tests/ produces a diff no reviewer will read, and
      # formatting drift there has caused no observed problem. See ADR-A6 --
      # this asymmetry is a decision, not an oversight, so please do not
      # "fix" it by adding tests/ here.
      - name: Format check
        run: ruff format --check backend/src/
      # --config-file is not optional. mypy discovers config from the current
      # directory and there is no pyproject.toml at the repository root, so
      # `mypy backend/src/` alone runs with mypy's defaults -- none of the
      # strict settings, none of the type-ratchet overrides. Verified: it
      # reports 80 errors in 17 files that way, against 0 with the config.
      - name: Type check
        run: mypy --config-file backend/pyproject.toml backend/src/
      # No --cov flags: /pytest.ini turns coverage on by default and
      # /.coveragerc holds the 80% floor. They were passed here explicitly
      # while the config in backend/pyproject.toml went unread, which is
      # exactly why the gap survived -- CI was green on a threshold that
      # applied nowhere else.
      - name: Tests
        run: pytest tests/backend/unit -v --tb=short

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true'
    env:
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: test-bucket
      PYTHONPATH: ${{ github.workspace }}/backend/src
      # No default in config.py -- there is no safe value to guess, so it must
      # be chosen explicitly. CI runs the unauthenticated path.
      AUTH_ENABLED: "false"
      MINISTACK_ENDPOINT: http://localhost:4566
    services:
      ministack:
        image: nahuelnucera/ministack
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DEFAULT_REGION: us-east-1
        # No --health-cmd: ministack image has no curl/wget (uvicorn entrypoint only).
        # Health is polled from the runner host below instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # From the lockfile, not requirements.txt: requirements.txt pins only the
      # eight direct dependencies, so every transitive version was whatever the
      # index served that morning. The dev extras stay unlocked because
      # backend/pyproject.toml already pins each of them exactly.
      - name: Install dependencies
        run: |
          uv pip install --system -r backend/requirements-lock.txt
          uv pip install --system -e "backend/.[dev]"
      - name: Wait for ministack
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:4566/_ministack/health >/dev/null; then
              echo "ministack ready"
              exit 0
            fi
            sleep 2
          done
          echo "ministack failed to become healthy" >&2
          exit 1
      # --no-cov: coverage is on by default from /pytest.ini, and eleven E2E
      # tests against MiniStack cannot reach the 80% floor that applies to the
      # unit suite. Measuring them and ignoring the number would be worse than
      # not measuring them.
      - name: Run E2E tests
        run: pytest tests/backend/e2e -v -m e2e --no-cov

  docs:
    name: Documentation Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Markdownlint
        run: make docs-lint

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend, backend, e2e, docs]
    if: always()
    steps:
      - name: Verify
        run: |
          results=(
            "${{ needs.frontend.result }}"
            "${{ needs.backend.result }}"
            "${{ needs.e2e.result }}"
            "${{ needs.docs.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more checks failed: $result"
              exit 1
            fi
          done
          echo "All checks passed!"
